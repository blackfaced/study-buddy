name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same PR when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        package: [mcp-server, server]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Skip mcp-server (no oxlint configured there); server runs `npm run lint` (oxlint syntax-level).
        if: matrix.package == 'server'
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install browser test dependencies
        if: matrix.package == 'server'
        run: |
          npm ci --prefix .. --no-audit --no-fund
          ../node_modules/.bin/playwright install --with-deps webkit

      - name: Writing layout regression (isolated WebKit)
        if: matrix.package == 'server'
        run: node --test ../e2e/write-layout.test.js
