<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e7">
  <title>小书童学习空间</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    /* Portal-specific layout */
    body { display: grid; place-items: center; padding: var(--space-5); }
    main { width: min(100%, 560px); }
    header { text-align: center; margin-bottom: var(--space-5); }
    h1 { margin: 0; font-size: var(--text-display); }
    header p { margin: var(--space-2) 0 0; color: var(--text-secondary); }
    .entries { display: grid; gap: var(--space-3); }
    /* v0.7 (issue #64): the JS-injected apps also need to stack with
       the same gap as the static .entry above. Without this, candy +
       write ended up glued together because they live in a plain div. */
    #apps { display: grid; gap: var(--space-3); }

    /* Today strip (subtle candy-tinted callout) */
    .game-strip { width: min(100%, 560px); margin: var(--space-5) auto 0; }
    .game-strip-link {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-card);
      background: rgba(255, 224, 234, 0.55);
      color: var(--text-primary);
      border: 1px dashed rgba(255, 107, 157, 0.5);
      transition: transform var(--duration-fast) var(--ease-default);
    }
    .game-strip-link:active { transform: scale(0.98); }
    .strip-emoji { font-size: 28px; }
    .strip-content { flex: 1; }
    .strip-title { display: block; font-size: var(--text-caption); font-weight: 700; color: #FF6B9D; }
    .strip-stats { display: block; font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .strip-stats b { color: #FF6B9D; font-variant-numeric: tabular-nums; }
    .strip-arrow { color: var(--accent); font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>小书童学习空间</h1>
      <p>选一个想做的事吧</p>
    </header>
    <section class="entries" aria-label="学习入口">
      <a class="entry" href="/buddy/" id="buddy-entry">
        <span class="emoji">📚</span>
        <span><h2>小书童陪伴</h2><p>聊天、拍题、一起写作业</p></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <div id="apps"></div>
    </section>

    <!-- 糖果口算今日战报（v0.6 — 显示今日 / 正确率 / 次数） -->
    <section class="game-strip" id="game-today-strip" style="display:none" aria-label="糖果口算今日战报">
      <a class="game-strip-link" href="/games/candy-math-island/">
        <span class="strip-emoji">🍭</span>
        <span class="strip-content">
          <span class="strip-title">今日口算战报</span>
          <span class="strip-stats">
            <b data-q>0</b> 题 ·
            正确率 <b data-rate>—</b> ·
            <b data-sessions>0</b> 次
          </span>
        </span>
        <span class="strip-arrow" aria-hidden="true">›</span>
      </a>
    </section>
  </main>
  <script src="/shared/app.js"></script>
  <script src="/buddy/photo-only.js"></script>
  <script>
    // Test-instance marker: /api/health env=test → 测试环境 badge
    // (3002 shares this code but not the kid's data).
    window.StudyBuddy.applyEnvBadge();
    // BUDDY_CHAT_ENABLED=false: swap the buddy entry to a photo-capture
    // entry. Fetch failure keeps the static copy (chat assumed on).
    async function loadBuddyEntry() {
      try {
        const res = await fetch('/api/buddy/status');
        if (!res.ok) return;
        const status = await res.json();
        const entry = window.BuddyPhotoOnly && window.BuddyPhotoOnly.portalEntry(status.chatEnabled);
        if (!entry) return;
        const link = document.getElementById('buddy-entry');
        link.querySelector('.emoji').textContent = entry.emoji;
        link.querySelector('h2').textContent = entry.title;
        link.querySelector('p').textContent = entry.desc;
      } catch { /* keep the static companion entry */ }
    }

    async function loadApps() {
      try {
        const res = await fetch('/api/apps');
        if (!res.ok) return;
        const { apps } = await res.json();
        const container = document.getElementById('apps');
        for (const app of apps || []) {
          if (app.status !== 'ready') continue;
          const link = document.createElement('a');
          link.className = 'entry';
          link.href = app.url;
          link.innerHTML = `<span class="emoji">${app.emoji || '📦'}</span><span><h2>${app.name}</h2><p>${app.description || ''}</p></span><span class="arrow" aria-hidden="true">›</span>`;
          container.appendChild(link);
        }
      } catch { /* The companion link still works when the API is unavailable. */ }
    }

    async function loadGameTodayStrip() {
      const strip = document.getElementById('game-today-strip');
      if (!strip) return;
      try {
        const res = await fetch('/api/game/daily?days=1&appId=candy-math-island');
        if (!res.ok) { strip.style.display = 'none'; return; }
        const data = await res.json();
        const today = (data.daily || [])[0];
        if (!today) { strip.style.display = 'none'; return; }
        strip.style.display = '';
        strip.querySelector('[data-q]').textContent = today.totalQuestions;
        strip.querySelector('[data-rate]').textContent = today.correctRate + '%';
        strip.querySelector('[data-sessions]').textContent = today.sessionCount;
      } catch { strip.style.display = 'none'; }
    }

    loadBuddyEntry();
    loadApps();
    loadGameTodayStrip();
  </script>
</body>
</html>
