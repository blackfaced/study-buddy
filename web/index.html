<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e7">
  <title>小书童学习空间</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #513a1e; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(160deg, #fff9ea, #ffe5b4); }
    main { width: min(100%, 560px); }
    header { text-align: center; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 30px; }
    header p { margin: 10px 0 0; color: #806748; }
    .entries { display: grid; gap: 14px; }
    .entry { display: flex; align-items: center; gap: 16px; padding: 20px; color: inherit; text-decoration: none; border-radius: 22px; background: rgba(255,255,255,.86); box-shadow: 0 8px 24px rgba(113,78,30,.12); transition: transform .15s, box-shadow .15s; }
    .entry:active { transform: scale(.98); box-shadow: 0 4px 12px rgba(113,78,30,.12); }
    .emoji { display: grid; place-items: center; flex: 0 0 54px; height: 54px; border-radius: 18px; background: #fff0cf; font-size: 30px; }
    .entry h2 { margin: 0 0 5px; font-size: 18px; }
    .entry p { margin: 0; color: #806748; font-size: 14px; line-height: 1.45; }
    .arrow { margin-left: auto; color: #be8a42; font-size: 22px; }

    .game-strip { width: min(100%, 560px); margin: 24px auto 0; }
    .game-strip-link {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(255, 224, 234, 0.55);
      color: #513a1e;
      text-decoration: none;
      border: 1px dashed rgba(255, 143, 177, 0.5);
      transition: transform .12s;
    }
    .game-strip-link:active { transform: scale(.98); }
    .strip-emoji { font-size: 28px; }
    .strip-content { flex: 1; }
    .strip-title { display: block; font-size: 14px; font-weight: 700; color: #FF6B9D; }
    .strip-stats { display: block; font-size: 13px; color: #806748; margin-top: 2px; }
    .strip-stats b { color: #FF6B9D; font-variant-numeric: tabular-nums; }
    .strip-arrow { color: #be8a42; font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>小书童学习空间</h1>
      <p>选一个想做的事吧</p>
    </header>
    <section class="entries" aria-label="学习入口">
      <a class="entry" href="/buddy/">
        <span class="emoji">📚</span>
        <span><h2>小书童陪伴</h2><p>聊天、拍题、一起写作业</p></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <div id="apps"></div>
    </section>

    <!-- 糖果口算今日战报（v0.6 — 显示今日 / 正确率 / 次数） -->
    <section class="game-strip" id="game-today-strip" style="display:none" aria-label="糖果口算今日战报">
      <a class="game-strip-link" href="/games/candy-math-island/">
        <span class="strip-emoji">🍭</span>
        <span class="strip-content">
          <span class="strip-title">今日口算战报</span>
          <span class="strip-stats">
            <b data-q>0</b> 题 ·
            正确率 <b data-rate>—</b> ·
            <b data-sessions>0</b> 次
          </span>
        </span>
        <span class="strip-arrow" aria-hidden="true">›</span>
      </a>
    </section>
  </main>
  <script>
    async function loadApps() {
      try {
        const res = await fetch('/api/apps');
        if (!res.ok) return;
        const { apps } = await res.json();
        const container = document.getElementById('apps');
        for (const app of apps || []) {
          if (app.status !== 'ready') continue;
          const link = document.createElement('a');
          link.className = 'entry';
          link.href = app.url;
          link.innerHTML = `<span class="emoji">${app.emoji || '📦'}</span><span><h2>${app.name}</h2><p>${app.description || ''}</p></span><span class="arrow" aria-hidden="true">›</span>`;
          container.appendChild(link);
        }
      } catch { /* The companion link still works when the API is unavailable. */ }
    }

    // 加载糖果口算的今日战报小条（如有）
    async function loadGameTodayStrip() {
      const strip = document.getElementById('game-today-strip');
      if (!strip) return;
      try {
        const res = await fetch('/api/game/daily?days=1&appId=candy-math-island');
        if (!res.ok) { strip.style.display = 'none'; return; }
        const data = await res.json();
        const today = (data.daily || [])[0];
        if (!today) { strip.style.display = 'none'; return; }
        strip.style.display = '';
        strip.querySelector('[data-q]').textContent = today.totalQuestions;
        strip.querySelector('[data-rate]').textContent = today.correctRate + '%';
        strip.querySelector('[data-sessions]').textContent = today.sessionCount;
      } catch { strip.style.display = 'none'; }
    }

    loadApps();
    loadGameTodayStrip();
  </script>
</body>
</html>
