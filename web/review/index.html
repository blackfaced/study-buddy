<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e7">
  <title>订正工作台</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    body { display: grid; place-items: start center; padding: var(--space-5); }
    main { width: min(100%, 560px); display: grid; gap: var(--space-4); }
    h1 { margin: 0 0 var(--space-2); font-size: var(--text-h1); }
    h2 { margin: 0 0 var(--space-2); font-size: var(--text-h2); }
    .card {
      padding: var(--space-4);
      border-radius: var(--radius-card);
      background: var(--surface-elevated);
      box-shadow: var(--shadow-soft);
    }
    .case-header { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
    .pill {
      display: inline-block;
      padding: 1px var(--space-2);
      border-radius: var(--radius-pill);
      font-size: 11px;
      background: rgba(255, 107, 157, 0.15);
      color: var(--accent);
    }
    .pill[data-source="manual"] { background: rgba(74, 144, 226, 0.15); color: #2a6cb0; }
    .pill[data-source="vision"] { background: rgba(155, 89, 182, 0.15); color: #6c3483; }
    .problem {
      font-size: 20px;
      font-weight: 600;
      padding: var(--space-3);
      background: var(--surface-input);
      border-radius: var(--radius-input);
      margin-bottom: var(--space-3);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .meta {
      display: grid;
      gap: var(--space-2);
      font-size: var(--text-caption);
      color: var(--text-secondary);
    }
    .meta-row { display: flex; gap: var(--space-2); align-items: baseline; }
    .meta-row .label { min-width: 5em; }
    .meta-row .value { color: var(--text-primary); }
    .meta-row.wrong .value { text-decoration: line-through; opacity: 0.7; }
    .meta-row.correct .value { color: var(--color-success, #1e8a4c); font-weight: 600; }
    .form { display: grid; gap: var(--space-3); margin-top: var(--space-3); }
    label { display: grid; gap: var(--space-1); font-size: var(--text-caption); color: var(--text-secondary); }
    input {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-input);
      font: inherit;
      background: var(--surface-input);
    }
    .actions { display: flex; gap: var(--space-2); justify-content: flex-end; }
    .btn {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-pill);
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface-input); color: var(--text-primary); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { font-size: var(--text-caption); color: var(--text-secondary); min-height: 1.2em; }
    .status[data-tone="error"] { color: var(--color-error, #c0392b); }
    .status[data-tone="success"] { color: var(--color-success, #1e8a4c); }
    .timeline { display: grid; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
    .timeline li {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--surface-input);
      border-radius: var(--radius-input);
      font-size: var(--text-caption);
    }
    .timeline li .icon { font-size: 16px; }
    .timeline li.correct .icon { color: var(--color-success, #1e8a4c); }
    .timeline li.wrong .icon { color: var(--color-error, #c0392b); }
    .timeline li.original .icon { color: var(--text-secondary); }
    .timeline li .when { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .back-link { display: inline-block; color: var(--text-secondary); }
    .closed-banner {
      padding: var(--space-3);
      border-radius: var(--radius-input);
      background: rgba(30, 138, 76, 0.1);
      color: var(--color-success, #1e8a4c);
      text-align: center;
      font-weight: 600;
    }
    .loading { color: var(--text-secondary); font-size: var(--text-caption); }
    .error-msg { color: var(--color-error, #c0392b); }
  </style>
</head>
<body>
  <main>
    <a class="back-link" id="back-link" href="/capture/">‹ 返回收件箱</a>
    <h1>订正工作台</h1>
    <div id="root">
      <p class="loading" id="loading">正在加载错题...</p>
    </div>
  </main>
  <script type="module" src="./review.js"></script>
</body>
</html>
