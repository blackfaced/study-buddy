<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffb84d">
  <title>写字练字 · v0.7</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <!-- Hanzi Writer 3.5.0 is vendored locally so origin-wide device
       credentials are never exposed to remotely served JavaScript. -->
  <script src="/vendor/hanzi-writer-3.5.0.min.js"></script>
  <script src="/shared/app.js"></script>
  <style>
    /* ===== Write app — iPad-first (横屏 friendly) ===== */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(180deg, var(--bg-page-start) 0%, var(--bg-page-end) 100%);
      color: var(--text-primary);
      font-family: -apple-system, "PingFang SC", sans-serif;
    }
    .app { max-width: 720px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    header h1 { font-size: 22px; margin: 0; }
    .back-to-portal { font-size: 24px; text-decoration: none; color: inherit; }

    /* ===== Home view (manual word entry) ===== */
    .home { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden; }
    .entry-row { display: flex; gap: 8px; }
    .entry-row input { flex: 1; padding: 10px 12px; font-size: 18px; border: 2px solid var(--accent); border-radius: 12px; }
    .entry-row button { padding: 10px 16px; font-size: 16px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: bold; }
    .entry-row button:active { background: #ff9500; }
    .word-list { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; padding: 4px; }
    .word-cell { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; background: white; border: 1px solid #e0d6c8; border-radius: 8px; }
    .word-cell button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; font-size: 12px; background: #ff8a65; color: white; border: none; border-radius: 50%; cursor: pointer; }
    .word-cell .attempts { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: #999; }
    .word-list:empty::before { content: "字库是空的。在上面输入字（可以一次贴一段）然后点「加进去」"; display: block; color: #999; padding: 24px; text-align: center; }
    .start-btn { padding: 14px 20px; font-size: 18px; background: var(--accent); color: white; border: none; border-radius: 16px; font-weight: bold; }
    .start-btn:disabled { background: #ccc; }
    .error-msg { color: #d32f2f; font-size: 14px; min-height: 18px; }
    /* Issue #80: success-state message (e.g. "✓ 新增 N 个") is
       green, not red. Same layout (font-size, min-height) so the
       line height doesn't jump when the message switches kind. */
    .success-msg { color: #2e7d32; font-size: 14px; min-height: 18px; }

    /* ===== Practice view (Apple Pencil + Hanzi Writer) ===== */
    .practice { display: none; flex: 1; flex-direction: column; align-items: center; gap: 12px; }
    .practice.active { display: flex; }
    .home.hidden { display: none; }
    .practice-stage { position: relative; width: min(560px, 92vw); aspect-ratio: 1; background: white; border: 2px solid var(--accent); border-radius: 12px; touch-action: none; }
    /* v0.8.3 (issue #81): persistent header above the stage.
       Stays visible across all phases so the kid always knows
       "第 N/M 字 · X". */
    .progress-header {
      width: min(560px, 92vw);
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary, #333);
      padding: 4px 0;
      min-height: 24px;
    }
    .progress-header.empty { color: transparent; }
    /* v0.7 (issue #63): keep 田字格 lines above the HanziWriter reference.
       HanziWriter's reference stroke is 200 units in a 600 viewBox, so it
       ends up ~33% of the stage width and visually overwrites the
       cross + diagonals unless we explicitly layer the grid on top. */
    .practice-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .practice-stage svg.interactive { pointer-events: auto; touch-action: none; cursor: crosshair; }
    /* char-center: wrapper that holds both the HanziWriter reference
       (#hanzi-target) and the kid's drawable SVG (#kid-svg). The
       char-center module applies `translate(...) scale(...)` here so
       the character fits the stage and lands on the grid center,
       regardless of viewport (phone ~358 stage vs pad ~560 stage).
       transform-origin: center means the scale shrinks toward the
       stage's middle; the translate then nudges the now-scaled
       character the remaining distance to the grid center. */
    .character-layer { position: absolute; inset: 0; transform-origin: center center; will-change: transform; }
    /* v0.7 (issue #63): grid sits above the reference SVG, and we clip
       the rotated 141.4%-tall diagonals so they don't bleed outside the
       stage box once the z-index promotes them. */
    .grid-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
    .grid-overlay::before, .grid-overlay::after,
    .grid-overlay > .diagonal {
      content: ''; position: absolute; background: rgba(23, 88, 200, 0.18);
    }
    .grid-overlay::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-0.5px); }
    .grid-overlay::after { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-0.5px); }
    .grid-overlay > .diagonal { width: 1px; height: 141.4%; top: 0; left: 0; transform-origin: 0 0; transform: rotate(45deg); }
    .grid-overlay > .diag2 { width: 1px; height: 141.4%; top: 0; right: 0; transform-origin: 100% 0; transform: rotate(-45deg); }
    .practice-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .practice-controls button { padding: 10px 16px; font-size: 14px; border: none; border-radius: 12px; background: var(--accent); color: white; font-weight: bold; }
    .practice-controls button.secondary { background: #64b5f6; }
    .practice-controls button.danger { background: #ff8a65; }
    /* v0.7 (issue #64): pulse the "下一字" button when the kid finishes
       a character and is waiting to advance. Old behaviour was a silent
       setTimeout(2500) that auto-jumped — kids missed the compare step. */
    .practice-controls button.cta {
      background: #4caf50;
      animation: cta-pulse 1.2s ease-in-out infinite;
    }
    @keyframes cta-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    .practice-controls .status { font-size: 14px; color: #555; margin-left: auto; }
    .score-line {
      text-align: center;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text-secondary);
      font-weight: 650;
      padding: var(--space-2) var(--space-3);
      letter-spacing: 0;
      max-width: min(560px, 92vw);
    }

    /* ===== Dictation mode (issue #196) ===== */
    .dictation-set-list { display: flex; flex-direction: column; gap: 8px; }
    .dictation-set-btn {
      padding: 14px 20px; font-size: 18px; font-weight: bold;
      background: #64b5f6; color: white; border: none; border-radius: 16px;
      text-align: left;
    }
    .dictation-set-btn:active { background: #1976d2; }
    .dictation-reveal {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      max-width: min(560px, 92vw);
    }
    .dictation-reveal-char {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; background: white; border: 2px solid var(--accent); border-radius: 8px;
    }
    /* #197: outcome confirmation row (revealed phase only) */
    .dictation-outcome { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .dictation-outcome button {
      padding: 10px 16px; font-size: 15px; border: 2px solid #e0d6c8;
      border-radius: 12px; background: white; color: var(--text-primary); font-weight: bold;
    }
    .dictation-outcome button.selected { border-color: var(--accent); background: #fff3e0; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <a class="back-to-portal" href="/" title="回门户" aria-label="回门户">🏠</a>
    <h1>✍️ 写字练字</h1>
    <div style="width: 24px"></div>
  </header>

  <!-- ============== Home view ============== -->
  <section class="home" id="home-view">
    <!-- v1.0 (issue #196): dictation mode entry. One button per active
         task set from GET /api/dictation/sets (kid view = active only).
         Hidden when there are no sets or the API is unreachable. -->
    <div id="dictation-home" style="display:none;">
      <div id="dictation-set-list" class="dictation-set-list"></div>
    </div>
    <div class="entry-row">
      <input id="chars-input" type="text" placeholder="贴上要练的字，比如 一二三上口" inputmode="text" autocomplete="off" />
      <button id="add-btn" type="button">加进去</button>
    </div>
    <div class="error-msg" id="home-error"></div>
    <div class="word-list" id="word-list"></div>
    <button class="start-btn" id="start-btn" type="button" disabled>开始练 ✍️</button>
  </section>

  <!-- ============== Practice view ============== -->
  <section class="practice" id="practice-view">
    <!-- v0.8.3 (issue #81): persistent progress header — stays visible
         through every phase so the kid always knows where they are in
         the 5-item session. The phase status (bottom-right) changes
         per phase, but this header does NOT. -->
    <div class="progress-header" id="progress-header" aria-live="polite"></div>
    <div class="practice-stage" id="stage">
      <div class="grid-overlay"><div class="diagonal"></div><div class="diag2"></div></div>
      <!-- character-layer: a single wrapper so char-center can
           translate+scale BOTH the HanziWriter reference and the
           kid's drawable SVG together. Without this wrapper, moving
           one would break the kid's coordinate alignment with the
           reference. -->
      <div class="character-layer" id="character-layer">
        <!-- Hanzi Writer mounts here; kid's strokes layer on top. -->
        <div id="hanzi-target" style="position:absolute; inset:0;"></div>
        <svg id="kid-svg" class="interactive" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" aria-label="孩子写字区"></svg>
      </div>
    </div>
    <div class="practice-controls">
      <!-- issue #196: dictation mode replay button (默写重听). Hidden
           in practice mode; dictation render owns its visibility. -->
      <button id="replay-audio-btn" type="button" class="secondary" style="display:none;">🔊 重听</button>
      <button id="again-btn" type="button" class="secondary">笔顺重放</button>
      <button id="undo-btn" type="button" class="secondary" style="display:none;">撤销</button>
      <button id="submit-btn" type="button" class="secondary" style="display:none;">提交</button>
      <button id="retry-btn" type="button" class="secondary" style="display:none;">重练</button>
      <!-- v0.8.3 (issue #85): 上一字 button lets the kid review their
           previous attempt. Disabled when on the first char. -->
      <button id="prev-btn" type="button" class="secondary" style="display:none;" disabled>上一字</button>
      <button id="next-btn" type="button" class="secondary" style="display:none;">下一题</button>
      <button id="exit-btn" type="button" class="danger">退出</button>
      <span class="status" id="status">看 3 秒后字会消失，凭记忆写</span>
    </div>
    <div class="score-line" id="score" style="display:none;"></div>
    <!-- issue #196: dictation self-check reveal — per-char target boxes,
         shown only after submit (dictation-view.js owns visibility). -->
    <div class="dictation-reveal" id="dictation-reveal" style="display:none;"></div>
    <!-- issue #197: dictation outcome confirmation — the kid/parent
         confirms each item in the compare view; only confirmed
         outcomes are POSTed. -->
    <div class="dictation-outcome" id="dictation-outcome" style="display:none;">
      <button id="outcome-correct" type="button">✓ 写对了</button>
      <button id="outcome-wrong" type="button">✗ 写错了</button>
      <button id="outcome-pinyin" type="button">🔤 拼音错</button>
      <button id="outcome-poor" type="button">✍️ 字丑</button>
    </div>
  </section>
</div>

<script type="module" src="./client.js"></script>
</body>
</html>
