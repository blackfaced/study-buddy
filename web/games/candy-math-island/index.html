<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF8FB1">
<title>🍭 糖果口算岛 · 60秒挑战</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  /* ===== Candy theme override (v0.6.6) =====
   * Inherits the warm theme defaults from /shared/theme.css and overrides
   * just the colors. Layout, components, iOS fixes all come from shared. */
  :root {
    --accent: #FF6B9D;
    --accent-soft: #FFE5EC;
    --bg-page-start: #FFE5EC;
    --bg-page-end: #FFF8F0;
    --bg-card: rgba(255, 255, 255, 0.85);
    --bg-input: #FFFAFC;
    --text-primary: #3D3D5C;
    --text-secondary: #806478;
    --text-on-accent: white;
  }
  body { overflow-x: hidden; }

  /* ===== Layout ===== */
  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding: var(--space-4); position: relative; }

  /* ===== Home ===== */
  .home { text-align: center; padding-top: 6vh; }
  .home-sub { font-size: var(--text-body); color: var(--text-secondary); margin-bottom: var(--space-6); }
  .start-card {
    background: linear-gradient(135deg, #FFB3D1 0%, #FF8FB1 100%);
    color: white;
    border-radius: 28px;
    padding: var(--space-5);
    box-shadow: 0 12px 32px rgba(255, 143, 177, 0.35);
    margin-bottom: var(--space-5);
  }
  .start-card .big { font-size: 60px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
  .start-card .label { font-size: var(--text-title); margin-top: var(--space-1); opacity: 0.95; }
  .btn-start {
    background: white;
    color: var(--accent);
    font-size: 22px;
    font-weight: 800;
    padding: var(--space-4) var(--space-7);
    margin-top: var(--space-4);
  }
  .today-strip {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border-radius: var(--radius-card);
    padding: var(--space-3) var(--space-4);
    font-size: var(--text-caption);
    color: var(--text-secondary);
    display: flex;
    justify-content: space-around;
    gap: var(--space-2);
  }
  .today-strip b { color: var(--accent); font-size: var(--text-title); }
  .nav-row { margin-top: var(--space-4); display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }

  /* ===== Quiz topbar (frosted) ===== */
  .quiz-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border-radius: var(--radius-card);
    padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-4);
    font-weight: 700;
  }
  .quiz-timer { font-size: 26px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .quiz-timer.warn { color: #FF4757; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .quiz-counter { font-size: var(--text-body); color: var(--text-secondary); }
  .quiz-counter b { color: var(--accent); }
  .quiz-actions { display: flex; gap: var(--space-1); }
  .quiz-actions .btn-pill { font-size: var(--text-caption); padding: var(--space-1) var(--space-3); }

  /* ===== Question card ===== */
  .question-card {
    background: white;
    border-radius: 28px;
    padding: var(--space-6) var(--space-5);
    box-shadow: var(--shadow-card-lg);
    text-align: center;
    margin-bottom: var(--space-5);
  }
  .q-text { font-size: 48px; font-weight: 800; color: var(--text-primary); letter-spacing: 2px; }
  .q-scenario { font-size: var(--text-body); color: var(--text-secondary); margin-bottom: var(--space-3); }

  /* ===== Answer input (pink border) ===== */
  .answer-input {
    width: 100%;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    padding: var(--space-3);
    border: 3px solid #FFD1E0;
    border-radius: var(--radius-input);
    color: var(--text-primary);
    background: var(--bg-input);
    margin-bottom: var(--space-3);
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: #4ECB71; background: #F0FFF4; animation: shake-good 0.3s; }
  .answer-input.wrong { border-color: #FF4757; background: #FFF0F0; animation: shake-bad 0.3s; }
  /* v0.8 (#116): inline wrong-answer explanation card. Hidden by default;
     shown when the kid answers wrong, hidden when they tap "下一题". */
  .explanation-card {
    display: none;
    background: #FFFBEA;
    border: 2px solid #FFD580;
    border-radius: var(--radius-input);
    padding: var(--space-3);
    margin-bottom: var(--space-3);
    text-align: left;
    animation: explanation-fade 0.25s ease-out;
  }
  .explanation-card.visible { display: block; }
  .explanation-card .explanation-title {
    font-size: var(--text-body);
    font-weight: 700;
    color: #C77B00;
    margin-bottom: 6px;
  }
  .explanation-card .explanation-body {
    font-size: 16px;
    line-height: 1.5;
    color: #5A4500;
    white-space: pre-wrap;
  }
  .explanation-card .explanation-next {
    display: inline-block;
    margin-top: var(--space-3);
    padding: 8px 18px;
    font-size: 18px;
    font-weight: 700;
    color: white;
    background: #C77B00;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  @keyframes explanation-fade {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake-good { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes shake-bad { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ===== Keypad ===== */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .keypad button {
    background: white;
    border-radius: 16px;
    padding: var(--space-4) 0;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    box-shadow: var(--shadow-button);
  }
  .keypad button:active { transform: scale(0.94); background: var(--accent-soft); }
  .keypad .key-w { background: var(--accent-soft); color: var(--accent); }

  /* ===== Result ===== */
  .result { text-align: center; padding-top: 4vh; }
  .result-emoji { font-size: 64px; margin-bottom: var(--space-2); }
  .result-title { font-size: var(--text-title); font-weight: 800; color: var(--text-primary); margin-bottom: var(--space-1); }
  .result-rate { font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1; }
  .result-rate-label { font-size: var(--text-caption); color: var(--text-secondary); margin-bottom: var(--space-5); }
  .stat-card h3 { font-size: var(--text-caption); color: var(--text-secondary); margin-bottom: var(--space-2); font-weight: 600; }
  .stat-row { display: flex; justify-content: space-between; font-size: var(--text-body); padding: var(--space-1) 0; }
  .result-actions { display: flex; gap: var(--space-2); justify-content: center; align-items: center; margin-top: var(--space-3); flex-wrap: wrap; }
  .stat-row b { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ===== Mistakes book + Parent dashboard (lite) ===== */
  .card h2 { font-size: var(--text-title); margin-bottom: var(--space-3); }
  .mistake-item { padding: var(--space-2) 0; border-bottom: 1px dashed #F0E0E8; font-size: 15px; }
  .mistake-item:last-child { border-bottom: none; }
  .mistake-item .prob { color: var(--text-primary); font-weight: 600; }
  .mistake-item .ans { color: var(--accent); margin-left: var(--space-2); }
  .mistake-item .correct { color: #4ECB71; margin-left: var(--space-2); }
  .empty-state { color: #9A8AA0; font-size: var(--text-caption); text-align: center; padding: var(--space-5); }

  /* Sub-page topbar (mistakes/parent — simpler than the app topbar) */
  .sub-topbar { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .sub-topbar .back { font-size: var(--text-button); color: var(--text-secondary); padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: rgba(255,255,255,0.6); }
  .sub-topbar .title { font-size: var(--text-title); font-weight: 700; flex: 1; text-align: center; }
</style>

<div class="app">

    <!-- v0.6.7: 统一 topbar (左: 🏠 回到门户, 右: 错题本 + 家长看板 快捷入口) -->
    <div class="app-topbar">

<script>
"use strict";

// ============== 配置 ==============
const APP_ID = "candy-math-island";
const DURATION_SEC = 60;  // 每局固定 60 秒
const API_BASE = "";      // 同源

// ============== 工具 ==============
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ============== 题目生成器 (按 errorType + level 拆细粒度) ==============
// v0.7 (#16): each generator declares its errorType so pickGenWithBias
// can bias toward the kid's recent weak topics. We replaced the old
// 3-generator L1/L2/L3 model with 7 sub-generators grouped by
// (errorType, level). The adaptive ladder (state.level) is still
// honored — pickGen filters to that level's items first, then biases.

// L1: 20 以内不进位/不退位
function genAddCompute() {  // 3+5, 个位相加 < 10
  const a = randInt(1, 9), b = randInt(1, 9);
  return { display: `${a} + ${b} = ?`, answer: a + b, errorType: "compute", level: 1 };
}
function genSubCompute() {  // 15-7, 不退位
  const big = randInt(10, 18), small = randInt(1, big % 10 || 1);
  // 强制不退位: 个位被减 >= 个位减
  let s = small;
  while ((big % 10) < (s % 10) && s > 1) s--;
  return { display: `${big} - ${s} = ?`, answer: big - s, errorType: "compute", level: 1 };
}
function genAddCarryEasy() {  // 8+5, 个位相加 >= 10 (简单进位)
  // 强制产生进位: 至少一个数 ≥ 5
  const a = randInt(5, 9), b = randInt(2, 9);
  // 个位相加必须 >= 10
  while ((a % 10) + (b % 10) < 10) {
    return genAddCarryEasy();
  }
  return { display: `${a} + ${b} = ?`, answer: a + b, errorType: "carry", level: 1 };
}
function genSubBorrowEasy() {  // 15-7, 简单退位（个位被减 < 个位减）
  // 强制退位: 个位被减 < 个位减
  let big = randInt(11, 18), small = randInt(2, 9);
  while ((big % 10) >= (small % 10)) {
    return genSubBorrowEasy();
  }
  return { display: `${big} - ${small} = ?`, answer: big - small, errorType: "borrow", level: 1 };
}

// L2: 100 以内进位加/退位减（口算重点）
function genAddCarry() {  // 27+35, 100 内进位加
  // 强制进位: 个位相加 >= 10
  let a = randInt(11, 89), b = randInt(2, 99 - a);
  while ((a % 10) + (b % 10) < 10) {
    a = randInt(11, 89);
    b = randInt(2, 99 - a);
  }
  return { display: `${a} + ${b} = ?`, answer: a + b, errorType: "carry", level: 2 };
}
function genSubBorrow() {  // 53-28, 100 内退位减
  // 强制退位: 个位被减 < 个位减
  let big = randInt(20, 99), small = randInt(2, big - 10);
  while ((big % 10) >= (small % 10) && small < big - 10) small++;
  return { display: `${big} - ${small} = ?`, answer: big - small, errorType: "borrow", level: 2 };
}

// L3: 表内乘法 / 简单应用
function genMultiply() {  // 7×8, 2-9 × 2-9
  const a = randInt(2, 9), b = randInt(2, 9);
  return { display: `${a} × ${b} = ?`, answer: a * b, errorType: "multiply", level: 3 };
}
function genScenarioMultiply() {  // 几个几应用题
  const groups = randInt(2, 9), each = randInt(2, 9);
  return { display: `${groups} 个 ${each}，一共多少？`, answer: groups * each, errorType: "multiply", level: 3, scenario: true };
}

// pickGenWithBias + buildBiasFromWeakTopics (imported as ES module below).
// Note: we deliberately don't bundle pickGenWithBias inline because the
// same module is unit-tested in pick-gen.test.js and reused by any
// future game app.
let _pickGenWithBias, _buildBiasFromWeakTopics;
async function loadPickGenModule() {
  if (_pickGenWithBias) return;
  const mod = await import("./pick-gen.js");
  _pickGenWithBias = mod.pickGenWithBias;
  _buildBiasFromWeakTopics = mod.buildBiasFromWeakTopics;
}

// v0.8 (#100, T3): sync-mistake-reviews module — extracted to a file
// so the queue-flush logic is unit-testable (see sync-mistake-reviews.test.js).
// Lazy-loaded on first use to keep the page-load path lean.
let _syncMistakeReviews;
async function loadSyncMistakeReviews() {
  if (_syncMistakeReviews) return;
  const mod = await import("./sync-mistake-reviews.js");
  _syncMistakeReviews = mod.syncMistakeReviews;
}

// v0.8 (#116, T4 = #34b): inline wrong-answer explanation card.
// Lazy-loaded on first wrong answer to keep the page-load path lean.
let _getExplanation;
async function loadExplanations() {
  if (_getExplanation) return;
  const mod = await import("./explanations.js");
  _getExplanation = mod.getExplanation;
}

const QUIZ_ITEMS = [
  { errorType: "compute",  level: 1, gen: genAddCompute },
  { errorType: "compute",  level: 1, gen: genSubCompute },
  { errorType: "carry",    level: 1, gen: genAddCarryEasy },
  { errorType: "borrow",   level: 1, gen: genSubBorrowEasy },
  { errorType: "carry",    level: 2, gen: genAddCarry },
  { errorType: "borrow",   level: 2, gen: genSubBorrow },
  { errorType: "multiply", level: 3, gen: genMultiply },
  { errorType: "multiply", level: 3, gen: genScenarioMultiply },
];

/** Fetch recent weak topics and convert to an errorType bias map.
 *  Returns the default-balanced bias if the request fails or there
 *  is no data. Safe to call repeatedly — caches nothing. */
async function fetchErrorTypeBias() {
  await loadPickGenModule();
  try {
    // v0.7 (issue #21): use shared fetch.
    const data = await StudyBuddy.fetch(API_BASE + "/api/game/weak-topics?days=7");
    return _buildBiasFromWeakTopics(data.weakTopics || []);
  } catch {
    return _buildBiasFromWeakTopics([]);
  }
}

/**
 * v0.8 (#99, #34a-2): fetch /api/game/quiz-context and build a
 * mistakeProvider closure for the picker. Returns null on any failure
 * (network error, server down, 4xx/5xx) so the picker can degrade
 * gracefully to "no mistake mix this session".
 *
 * Why a closure instead of a plain array: pickGenWithBias calls the
 * provider once per pick, so the provider can manage the "draw
 * without replacement" invariant itself (we just shift the pool).
 * This keeps the picker stateless.
 */
async function fetchQuizContext() {
  try {
    // Client's local day in the kid's timezone (matches the server's
    // expectation that date is a YYYY-MM-DD string in the kid's day).
    const date = new Date().toLocaleDateString("en-CA"); // en-CA → YYYY-MM-DD
    const data = await StudyBuddy.fetch(API_BASE + "/api/game/quiz-context", {
      method: "POST",
      body: { childId: "default", date },
    });
    if (!data || data.eligible !== true || !Array.isArray(data.mistakes) || data.mistakes.length === 0) {
      return null;
    }
    const pool = data.mistakes.slice();
    return () => pool.length > 0 ? pool.shift() : null;
  } catch {
    return null;
  }
}
function pickGen() {
  if (!_pickGenWithBias) {
    // pickGen called before module loaded — degrade to the old
    // per-level flat picker so the UI doesn't crash.
    return QUIZ_ITEMS.filter(it => it.level === (state.level ?? 1))[0]?.gen
      ?? QUIZ_ITEMS[0].gen;
  }
  const lvl = state.level ?? 1;
  const r = Math.random();
  let levels;
  if (r < ADAPTIVE.CURRENT_LEVEL_WEIGHT) {
    levels = [lvl];
  } else {
    // 20% "explore" — only downgrade, never upgrade. Rationale: if
    // borrow is the weak topic at L2, jumping to L3 multiply would
    // burn question slots on a topic the kid isn't weak in. Picking
    // L1 keeps the bias meaningful; on L1 we degrade to current level
    // (no lower to go).
    const downgrades = [1, 2, 3].filter(n => n < lvl);
    levels = downgrades.length > 0
      ? [downgrades[Math.floor(Math.random() * downgrades.length)]]
      : [lvl];
  }
  const bias = state.errorTypeBias || { carry: 0.25, borrow: 0.15, multiply: 0.1, compute: 0.5 };
  // v0.8 (#99, #34a-2): 30% mistake-mix window. mistakeProvider is a
  // closure that yields a fresh due mistake per call; pickGenWithBias
  // wraps it into the Question shape. Falls through to the regular
  // weighted path when the pool is empty (no starvation). When the
  // server said eligible:false (5+ sessions today) or the fetch
  // failed, mistakeProvider is null and the gate is disabled.
  const pick = _pickGenWithBias(QUIZ_ITEMS, bias, Math.random, {
    levels,
    mistakeProvider: state.mistakeProvider,
    mistakeRate: 0.3,
  });
  return pick();
}

// ============== 状态 ==============
let state = {
  durationMs: DURATION_SEC * 1000,
  remainingMs: DURATION_SEC * 1000,
  totalQuestions: 0,
  correctCount: 0,
  currentQuestion: null,
  currentAnswer: "",
  questionStartedAt: 0,
  startedAt: 0,
  endedAt: 0,
  pendingMistakes: [],  // 等待同步到 server 的错题
  tickHandle: null,
  // 自适应阶梯 (v0.6.1 option A): 60s 内根据答题连击升降 L1↔L2↔L3
  level: 1,           // 1=简单 (L1), 2=中等 (L2 进位/退位), 3=挑战 (L3 乘法/应用)
  streak: 0,          // 连续答对次数
  wrongStreak: 0,     // 连续答错次数
  // v0.8 (#99, #34a-2): 30% mistake-mix provider. Set by startQuiz
  // after fetching /api/game/quiz-context; null when the server says
  // the kid is past the 5-sessions/day window or the fetch failed.
  mistakeProvider: null,
  // pendingMistakeReviews: list of {mistakeId, correct} for the
  // /api/game/mistake-review cascade (T3, #100). Filled when a
  // mistake (fromMistake:true) is answered; flushed at session end.
  pendingMistakeReviews: [],
};

const ADAPTIVE = {
  PROMOTE_AT: 3,      // 连对 3 题升级
  DEMOTE_AT: 2,       // 连错 2 题降级
  MAX_LEVEL: 3,
  MIN_LEVEL: 1,
  // 选题权重: 当前等级 80%, 其他等级平均分 20%
  CURRENT_LEVEL_WEIGHT: 0.80,
};

/**
 * Pure state machine: given current level + streak + whether the latest
 * answer was correct, return the new level state and a side effect
 * (level-up / level-down / none). Streaks reset on promotion/demotion
 * or when the answer doesn't follow the trend (e.g. correct after a
 * wrong streak resets the wrong streak to 0).
 */
function updateAdaptiveLevel(level, streak, wrongStreak, isCorrect) {
  if (isCorrect) {
    const newStreak = streak + 1;
    if (newStreak >= ADAPTIVE.PROMOTE_AT && level < ADAPTIVE.MAX_LEVEL) {
      return { level: level + 1, streak: 0, wrongStreak: 0, event: "promote" };
    }
    return { level, streak: newStreak, wrongStreak: 0, event: "none" };
  } else {
    const newWrongStreak = wrongStreak + 1;
    if (newWrongStreak >= ADAPTIVE.DEMOTE_AT && level > ADAPTIVE.MIN_LEVEL) {
      return { level: level - 1, streak: 0, wrongStreak: 0, event: "demote" };
    }
    return { level, streak: 0, wrongStreak: newWrongStreak, event: "none" };
  }
}

const STORAGE = { wrong: "candy_wrong_v2" };
function loadWrong() { try { return JSON.parse(localStorage.getItem(STORAGE.wrong) || "[]"); } catch { return []; } }
function saveWrong(list) { try { localStorage.setItem(STORAGE.wrong, JSON.stringify(list)); } catch {} }

// ============== 页面切换 ==============
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const el = document.getElementById("page-" + id);
  if (el) el.classList.add("active");
  if (id === "home") loadHomeStats();
  if (id === "parent") loadParentStats();
  if (id === "mistakes") renderMistakes();
}

// ============== 首页 ==============
async function loadHomeStats() {
  const strip = document.getElementById("today-strip");
  // 默认文案：first-time 暖消息（issue #82，避免冷冰冰的 3 个 0 像成绩单）
  if (window.CandyHomeStats) {
    const r = window.CandyHomeStats.renderHomeStrip(null);
    strip.outerHTML = r.html;
  }
  try {
    // v0.7 (issue #21): use shared fetch.
    const data = await StudyBuddy.fetch(API_BASE + "/api/game/daily?days=1&appId=" + APP_ID);
    const today = (data.daily || [])[0];
    if (window.CandyHomeStats) {
      const r = window.CandyHomeStats.renderHomeStrip(today);
      // outerHTML replace gives us a fresh node; re-grab.
      document.getElementById("today-strip").outerHTML = r.html;
    }
  } catch {}
}

document.getElementById("btn-start").onclick = startQuiz;
document.getElementById("btn-home").onclick = () => showPage("home");
document.getElementById("btn-mistakes-link").onclick = (e) => { e.preventDefault(); showPage("mistakes"); };
document.getElementById("btn-parent-link").onclick = (e) => { e.preventDefault(); showPage("parent"); };
document.getElementById("btn-mistakes-back").onclick = () => showPage("home");
document.getElementById("btn-parent-back").onclick = () => showPage("home");

// ============== 答题循环 ==============
async function startQuiz() {
  state.remainingMs = state.durationMs;
  state.totalQuestions = 0;
  state.correctCount = 0;
  state.pendingMistakes = [];
  state.pendingMistakeReviews = [];
  state.mistakeProvider = null;
  state.startedAt = Date.now();
  // v0.6.1: reset adaptive ladder state for a fresh 60s sprint.
  state.level = 1;
  state.streak = 0;
  state.wrongStreak = 0;
  // v0.7 (#16): fetch recent weak topics to bias question generation.
  // The fetch runs in parallel with the page transition; the first
  // question will use whatever bias is ready by the time nextQuestion()
  // runs (or the default-balanced bias if the fetch is still in flight,
  // since pickGen has a fallback). If the server is unreachable we
  // silently fall back to the default bias — kid should never see an
  // error for a "nice to have" optimization.
  state.errorTypeBias = await fetchErrorTypeBias();
  // v0.8 (#99, #34a-2): fetch due mistakes for the 30% mix window.
  // Same graceful-degrade philosophy as the bias fetch — server down
  // means a regular session (no mix), not a crash.
  state.mistakeProvider = await fetchQuizContext();
  updateLevelBadge(state.level);
  showPage("quiz");
  nextQuestion();
  if (state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(tick, 100);
  // 焦点让数字键盘弹起（iPad Safari）
  setTimeout(() => document.getElementById("answer-input").focus(), 100);
}

/** Update the "L1/L2/L3" badge in the quiz topbar. */
function updateLevelBadge(level) {
  const el = document.getElementById("quiz-level");
  if (el) el.textContent = String(level);
}

/** Brief visual feedback when the level changes mid-game. */
function flashLevelEvent(event) {
  if (event === "none") return;
  const el = document.getElementById("quiz-level");
  if (!el) return;
  const orig = el.style.color;
  el.style.color = event === "promote" ? "#4ECB71" : "#FF4757";
  el.style.transition = "color 0.2s";
  setTimeout(() => { el.style.color = orig; }, 600);
}

function nextQuestion() {
  state.currentQuestion = pickGen();
  state.currentAnswer = "";
  state.questionStartedAt = Date.now();
  // v0.8 (#116, T4 = #34b): hide the explanation card for the new
  // question. The card was either dismissed by the "下一题" button
  // (already hidden) or still visible from a previous wrong answer
  // (we hide it here so the new question renders clean).
  hideExplanationCard();
  const el = document.getElementById("q-text");
  el.textContent = state.currentQuestion.display;
  const scenEl = document.getElementById("q-scenario");
  if (state.currentQuestion.scenario) {
    scenEl.textContent = "（应用题）";
    scenEl.style.display = "block";
  } else {
    scenEl.style.display = "none";
  }
  document.getElementById("answer-input").value = "";
  document.getElementById("answer-input").className = "answer-input";
  document.getElementById("quiz-count").textContent = state.totalQuestions;
}

function tick() {
  // v0.8.3 (issue #83): when paused, freeze the timer.
  if (state.paused) return;
  state.remainingMs -= 100;
  if (state.remainingMs <= 0) {
    state.remainingMs = 0;
    endQuiz();
    return;
  }
  const sec = Math.ceil(state.remainingMs / 1000);
  const t = document.getElementById("quiz-timer");
  t.textContent = sec;
  if (sec <= 10) t.classList.add("warn"); else t.classList.remove("warn");
}

function submitAnswer() {
  if (!state.currentQuestion) return;
  const raw = state.currentAnswer.trim();
  if (raw === "") return;  // 忽略空提交
  const user = parseInt(raw, 10);
  if (isNaN(user)) return;
  const correct = state.currentQuestion.answer;
  state.totalQuestions++;
  const inputEl = document.getElementById("answer-input");
  const isCorrect = (user === correct);
  if (isCorrect) {
    state.correctCount++;
    inputEl.classList.add("correct");
    // v0.8 (#116, T4 = #34b): correct answer → no explanation card.
    // The card is hidden in nextQuestion() too, but hiding here covers
    // the rare case where the kid types the right answer after a wrong
    // one (we don't want the previous card to linger if they hit ⌫).
    hideExplanationCard();
    // v0.8 (#99, T3 prep): if this correct answer was a review of a
    // picked mistake, queue the cascade increment. The actual
    // /api/game/mistake-review endpoint is T3 (#100, not yet
    // implemented) — syncMistakeReviews silently no-ops on 404.
    if (state.currentQuestion.fromMistake && state.currentQuestion.mistakeId) {
      state.pendingMistakeReviews.push({
        mistakeId: state.currentQuestion.mistakeId,
        correct: true,
      });
    }
  } else {
    inputEl.classList.add("wrong");
    // 收集错题，留给 syncToServer
    // v0.8 (#99, #34a-2): contract changed to match the new server
    // endpoint — user/correct answers are strings, no subject/level
    // (those are derived server-side from app_id). The mistake is
    // queued for POST /api/game/mistake.
    state.pendingMistakes.push({
      problem: state.currentQuestion.display,
      errorType: state.currentQuestion.errorType,  // v0.7 (#16): declared by the generator
      userAnswer: String(user),
      correctAnswer: String(correct),
      syncedToServer: false,
      ts: Date.now(),
    });
    // v0.8 (#99, T3 prep): if this wrong answer was a mistake picked
    // from the 30% review-mix, queue it for the cascade-review
    // endpoint (T3 = #100, not yet implemented — endpoint is a no-op
    // until T3 lands). The cascade bookkeeping is harmless if the
    // server doesn't have the endpoint yet: syncMistakeReviews silently
    // no-ops on 404.
    if (state.currentQuestion.fromMistake && state.currentQuestion.mistakeId) {
      state.pendingMistakeReviews.push({
        mistakeId: state.currentQuestion.mistakeId,
        correct: false,
      });
    }
    // v0.8 (#116, T4 = #34b): wrong answer → show inline explanation
    // card with the question's errorType. The card is dismissed by
    // the "下一题" button (advances to next question) or by the next
    // question's render (whichever happens first). Lazy-load the
    // explanations module on first use; on the very first wrong
    // answer in a session this adds < 1ms (file is small and cached
    // by the browser after the first import).
    await loadExplanations();
    showExplanationCard(_getExplanation(state.currentQuestion.errorType));
    // No automatic setTimeout — the kid reads the card, then taps
    // "下一题". (Previously wrong-answer flow auto-advanced after
    // 280ms; the card is the new "next" affordance.)
    return;
  }
  // v0.6.1: 自适应阶梯 — 根据对错更新 level
  const next = updateAdaptiveLevel(state.level, state.streak, state.wrongStreak, isCorrect);
  state.level = next.level;
  state.streak = next.streak;
  state.wrongStreak = next.wrongStreak;
  if (next.event !== "none") {
    updateLevelBadge(state.level);
    flashLevelEvent(next.event);
  }
  // 短暂停留后下一题 (correct answer path — no card shown)
  setTimeout(nextQuestion, 280);
}

// v0.8 (#116, T4 = #34b): inline explanation card helpers. The card
// is hidden by default (CSS), and shown on wrong answers. "下一题"
// button hides the card and advances to the next question — same as
// the auto-advance that used to fire on wrong answers before v0.8.
function showExplanationCard(explanation) {
  const card = document.getElementById("explanation-card");
  document.getElementById("explanation-title").textContent = explanation.title;
  document.getElementById("explanation-body").textContent = explanation.body;
  card.classList.add("visible");
  // Don't auto-advance — the kid reads, then taps the button.
}

function hideExplanationCard() {
  const card = document.getElementById("explanation-card");
  if (card) card.classList.remove("visible");
}

function endQuiz() {
  if (state.tickHandle) { clearInterval(state.tickHandle); state.tickHandle = null; }
  state.endedAt = Date.now();
  // v0.8 (#116, T4 = #34b): hide the explanation card on session
  // end so the result page renders clean. (Without this the card
  // would linger if the timer reached 0 while the card was showing.)
  hideExplanationCard();
  showResult();
  // 异步：先上报错题，再上报本局战绩，再拉今日累计
  syncToServer().then(recordSession).then(loadHomeStats).catch(() => {});
}

// v0.8 (#116, T4 = #34b): wire the "下一题" button. Hides the card
// and advances to the next question. Same semantics as the auto-
// advance that used to fire on wrong answers before v0.8.
document.getElementById("explanation-next").onclick = () => {
  hideExplanationCard();
  nextQuestion();
};

document.getElementById("btn-quit").onclick = () => {
  if (state.totalQuestions === 0) { showPage("home"); return; }
  if (confirm("确定结束本局？")) endQuiz();
};

// v0.8.3 (issue #83): pause / resume the 60s challenge so the kid
// can step away (bathroom, snack, parent calls) without losing
// the current question or the remaining time.
document.getElementById("btn-pause").onclick = () => {
  togglePause();
};

function togglePause() {
  if (!state.tickHandle) return;  // not in an active round
  state.paused = !state.paused;
  const pauseBtn = document.getElementById("btn-pause");
  const inputEl = document.getElementById("answer-input");
  const keypad = document.getElementById("keypad");
  pauseBtn.textContent = state.paused ? "继续" : "暂停";
  inputEl.disabled = !!state.paused;
  // Disable the keypad buttons while paused (input is the canonical
  // answer path; both are protected so the kid can't accidentally
  // answer during a pause).
  if (keypad) {
    for (const b of keypad.querySelectorAll("button")) {
      b.disabled = !!state.paused;
    }
  }
}

// v0.8.3 (issue #83): auto-pause when the tab is backgrounded.
// Best-effort — don't depend on this. Kids can also tap 暂停.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.tickHandle && !state.paused) {
    togglePause();
  }
});

// ============== 数字键盘 / 输入 ==============
const inputEl = document.getElementById("answer-input");
inputEl.addEventListener("input", (e) => {
  const v = e.target.value.replace(/[^\d-]/g, "");
  e.target.value = v;
  state.currentAnswer = v;
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitAnswer(); }
});

document.querySelectorAll("#keypad button").forEach(btn => {
  // Use pointerdown (not click) to avoid iOS Safari's 300ms tap delay.
  // The keypad area has `touch-action: manipulation` so the system
  // still gets pinch/drag gestures but doesn't wait for double-tap.
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();  // suppress the synthesized click + focus jump
    const k = btn.dataset.k;
    if (k === "back") {
      state.currentAnswer = state.currentAnswer.slice(0, -1);
    } else if (k === "ok") {
      submitAnswer();
      return;
    } else {
      // 限制最大 4 位
      if (state.currentAnswer.length >= 4) return;
      state.currentAnswer += k;
    }
    inputEl.value = state.currentAnswer;
  });
});

// ============== 错题同步 (跟 v0.8 一致) ==============
async function syncToServer() {
  for (const m of state.pendingMistakes) {
    if (m.syncedToServer) continue;
    try {
      // v0.7 (issue #21): use shared fetch (auto-serialises body, sets
      // Content-Type, throws on non-2xx).
      // v0.8 (#99, #34a-2): contract changed — string user/correct
      // answer, no subject/level (server derives them from source +
      // app context). Returns {id, created} not {mistakeId}. The
      // dedupe is server-side via UNIQUE (child_id, problem).
      await StudyBuddy.fetch(API_BASE + "/api/game/mistake", {
        method: "POST",
        body: {
          childId: "default",
          problem: m.problem,
          errorType: m.errorType,
          userAnswer: m.userAnswer,
          correctAnswer: m.correctAnswer,
          source: "game",
        },
      });
      m.syncedToServer = true;
    } catch (e) {
      // 4xx/5xx (e.status set): 标记为 synced, 避免无限重试.
      // network error (no e.status): 保留 unsynced, 下次重试.
      if (e && e.status) m.syncedToServer = true;
    }
  }
  // v0.8 (#100, T3): sync the cascade-review queue. Implemented in
  // sync-mistake-reviews.js (extracted for unit testability). Fire-and-
  // forget: we don't await — the session-end recordSession() chain
  // must not be blocked on the cascade endpoint. The helper swallows
  // its own errors (network, 4xx, 5xx) and clears the queue in place
  // either way — see the module header for why we drop on error
  // instead of retrying.
  if (state.pendingMistakeReviews.length > 0) {
    await loadSyncMistakeReviews();
    _syncMistakeReviews(state.pendingMistakeReviews, {
      fetchFn: StudyBuddy.fetch,
      apiBase: API_BASE,
      childId: "default",
    });
  }
  // 持久化到 localStorage（包括已同步的，给错题本用）
  const unsynced = state.pendingMistakes.filter(m => !m.syncedToServer);
  if (unsynced.length > 0) {
    // 把未同步的也存到 localStorage，下次开局重试
    const existing = loadWrong();
    saveWrong(existing.concat(unsynced));
  }
  // 错题本：保存本局所有错题（不管是否已同步）
  const all = loadWrong();
  for (const m of state.pendingMistakes) {
    all.push(m);
  }
  // 限制 localStorage 大小（最近 200 条）
  if (all.length > 200) all.splice(0, all.length - 200);
  saveWrong(all);
}

async function recordSession() {
  try {
    // v0.7 (issue #21): use shared fetch.
    await StudyBuddy.fetch(API_BASE + "/api/game/session", {
      method: "POST",
      body: {
        childId: "default",
        appId: APP_ID,
        durationSec: Math.round((state.endedAt - state.startedAt) / 1000),
        totalQuestions: state.totalQuestions,
        correctCount: state.correctCount,
        startedAt: state.startedAt,
        endedAt: state.endedAt,
      },
    });
  } catch { /* 静默失败；server 端无记录 */ }
}

// ============== 结果页 ==============
async function showResult() {
  showPage("result");
  const rate = state.totalQuestions > 0 ? Math.round((state.correctCount / state.totalQuestions) * 100) : 0;
  document.getElementById("result-rate").textContent = rate + "%";
  document.getElementById("result-total").textContent = state.totalQuestions;
  document.getElementById("result-correct").textContent = state.correctCount;
  document.getElementById("result-wrong").textContent = state.totalQuestions - state.correctCount;
  const dur = (state.endedAt - state.startedAt) / 1000;
  const avg = state.totalQuestions > 0 ? (dur / state.totalQuestions).toFixed(1) : "0.0";
  document.getElementById("result-avg").textContent = avg + " 秒";
  document.getElementById("result-emoji").textContent = rate >= 90 ? "🏆" : rate >= 70 ? "🎉" : rate >= 50 ? "💪" : "🌱";
  document.getElementById("result-title").textContent = rate >= 90 ? "太厉害啦！" : rate >= 70 ? "不错哟" : rate >= 50 ? "继续加油" : "慢慢来不急";

  // 拉今日累计
  try {
    // v0.7 (issue #21): use shared fetch.
    const data = await StudyBuddy.fetch(API_BASE + "/api/game/daily?days=1&appId=" + APP_ID);
    const today = (data.daily || [])[0];
    if (today) {
      document.getElementById("today-total").textContent = today.totalQuestions;
      document.getElementById("today-rate").textContent = today.correctRate + "%";
      document.getElementById("today-sessions").textContent = today.sessionCount;
    }
  } catch {}
}

document.getElementById("btn-again").onclick = startQuiz;

// ============== 错题本 ==============
function renderMistakes() {
  const list = loadWrong().slice().reverse().slice(0, 50);
  const el = document.getElementById("mistakes-list");
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-state">还没有错题，快去玩一局吧</div>';
    return;
  }
  el.innerHTML = list.map(m =>
    `<div class="mistake-item">
       <span class="prob">${escapeHtml(m.problem)}</span>
       <span class="ans">答: ${m.userAnswer}</span>
       <span class="correct">对: ${m.correctAnswer}</span>
     </div>`
  ).join("");
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ============== 家长看板 ==============
async function loadParentStats() {
  const el = document.getElementById("daily-stats");
  el.innerHTML = '<div class="empty-state">加载中…</div>';
  try {
    // v0.7 (issue #21): use shared fetch.
    const data = await StudyBuddy.fetch(API_BASE + "/api/game/daily?days=7&appId=" + APP_ID);
    const days = data.daily || [];
    if (days.length === 0) {
      el.innerHTML = '<div class="empty-state">最近 7 天还没有记录</div>';
      return;
    }
    el.innerHTML = days.map(d =>
      `<div class="mistake-item">
         <span class="prob">${d.date}</span>
         <span style="margin-left:12px">${d.totalQuestions} 题</span>
         <span class="ans" style="margin-left:12px">${d.correctRate}% 正确</span>
         <span style="margin-left:12px;color:#9A8AA0">${d.sessionCount} 次</span>
       </div>`
    ).join("");
  } catch (e) {
    el.innerHTML = '<div class="empty-state">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

// ============== 离开页面前 flush 错题 ==============
window.addEventListener("pagehide", () => { if (state.pendingMistakes.length) syncToServer().catch(() => {}); });
window.addEventListener("beforeunload", () => { if (state.pendingMistakes.length) syncToServer().catch(() => {}); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && state.pendingMistakes.length) {
    syncToServer().catch(() => {});
  }
});

// ============== 启动 ==============
showPage("home");
loadHomeStats();
</script>
